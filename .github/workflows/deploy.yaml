name: Deploy Application

on:
  push:
    branches:
      - 'feat_*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'
        type: string

env:
  DOCKER_COMPOSE_FILE: docker-compose.yaml
  DEPLOY_DIR: /opt/fortstack

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set deployment variables
        id: vars
        run: |
          echo "tag=${{ github.event.inputs.tag || 'latest' }}" >> $GITHUB_OUTPUT
          echo "Deploying with tag: ${{ github.event.inputs.tag || 'latest' }}"
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get Slack User ID from Email
        id: get_user
        run: |
          USER_ID=$(curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            "https://slack.com/api/users.lookupByEmail?email=o.saadkhalifa@outlook.com" \
            | jq -r '.user.id')

          if [ "$USER_ID" == "null" ] || [ -z "$USER_ID" ]; then
            echo "Could not find Slack user"
            exit 1
          fi

          echo "user_id=$USER_ID" >> $GITHUB_OUTPUT

      - name: Notify Slack Success
        if: success()
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
          -H "Content-type: application/json" \
          --data "{
            \"channel\": \"${{ steps.get_user.outputs.user_id }}\",
            \"text\": \":white_check_mark: *Workflow succeeded!* Repository: $GITHUB_REPOSITORY Branch: $GITHUB_REF_NAME\"
          }" \
          https://slack.com/api/chat.postMessage

      - name: Notify Slack Failure
        if: failure()
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
          -H "Content-type: application/json" \
          --data "{
            \"channel\": \"${{ steps.get_user.outputs.user_id }}\",
            \"text\": \":x: *Workflow failed!* Repository: $GITHUB_REPOSITORY Branch: $GITHUB_REF_NAME\"
          }" \
          https://slack.com/api/chat.postMessage
  
